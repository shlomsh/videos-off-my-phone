# Runs the tests and builds the store zip on every push and pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Syntax check
        run: for f in $(git ls-files 'extension/*.js'); do node --check "$f"; done
      - name: Store zip builds (no key, STORE_BUILD on)
        run: npm run pack
